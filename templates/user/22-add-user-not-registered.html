<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../static/css/default.css" />
    <!-- Choices.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

    <link rel="shortcut icon" href="../../static/assets/images/logos/adidas.png" type="image/x-icon" />
    <title>Adicionar Usuário Não Registrado</title>

    <style>
        .container {
            background-image: url("../../static/assets/images/shoes-2.png");
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 20px;
            z-index: 2;
            text-align: center;
        }

        form {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 30px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 100%;
        }

        .form-item {
            position: relative;
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-item input,
        .form-item select {
            width: 100%;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: "Roboto", sans-serif;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            font-family: "Roboto", sans-serif;
            color: white;
            background: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:hover {
            background: #555;
        }

        .result-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            display: none;
        }

        .success {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

        /* Estilo para o Select2 */
        .select2-container--bootstrap4 .select2-selection--single {
            height: calc(1.5em + 0.75rem + 2px) !important;
        }

        .select2-container--bootstrap4 .select2-selection__rendered {
            color: #000000 !important;
            line-height: calc(1.5em + 0.75rem) !important;
            font-weight: normal !important;
        }

        .select2-selection__rendered {
            color: #000000 !important;
        }

        .select2-container--bootstrap4 .select2-selection {
            border: 1px solid #ced4da !important;
        }

        .select2-selection__rendered {
            display: block !important;
            visibility: visible !important;
        }

        /* Estilos para as seções do formulário */
        .form-section {
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #ddd;
        }

        .form-section h2 {
            color: #333;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="overlay"></div>
        <h1>Adicionar Usuário Não Registrado</h1>
        <form id="add-user-form">
            <div class="form-section">
                <h2>Usuário</h2>
                <div class="form-item">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required />
                </div>
                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="form-item">
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required />
                </div>
                <div class="form-item">
                    <label for="documento">Documento (CPF):</label>
                    <input type="text" id="documento" name="documento" required />
                </div>
                <div class="form-item">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" />
                </div>

                <div class="form-item">
                    <label for="modelo">Modelo:</label>
                    <select id="modelo" name="modelo" required>
                        <option value="">Selecione um modelo</option>
                        {% for modelo in modelos %}
                        <option value="{{ modelo.id }}">{{ modelo.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-item">
                    <label for="tamanho">Tamanho:</label>
                    <input type="number" id="tamanho" name="tamanho" required />
                </div>
            </div>

            <div class="form-section">
                <h2>Ação</h2>
                <div class="form-item">
                    <label for="data_inicio">Data de Início:</label>
                    <input type="date" id="data_inicio" name="data_inicio" required />
                </div>
                <div class="form-item">
                    <label for="veiculo">Veículo:</label>
                    <select id="veiculo" name="veiculo_id" required>
                        <option value="">Selecione um veículo</option>
                        {% for veiculo in veiculos %}
                        <option value="{{ veiculo.id }}">{{ veiculo.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-item">
                    <label for="local">Local:</label>
                    <select id="local" name="local_id" required>
                        <option value="">Selecione um local</option>
                        {% for local in locais %}
                        <option value="{{ local.id }}">{{ local.cidade }}/{{ local.estado }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-item">
                    <label for="local_treino">Local de Treino:</label>
                    <select id="local_treino" name="local_treino_id" required>
                        <option value="">Selecione um local de treino</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="tipo_treino">Tipo de Treino:</label>
                    <select id="tipo_treino" name="tipo_treino_id" required>
                        <option value="">Selecione um tipo de treino</option>
                        {% for tipo in tipos_treino %}
                        <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="btn-container">
                <button type="submit">ADICIONAR USUÁRIO</button>
            </div>
            <div id="result" class="result-container"></div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- jQuery Mask Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <!-- Choices.js -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        $(document).ready(function () {
            // Aplicar máscaras aos campos
            $('#documento').mask('000.000.000-00', { placeholder: "___.___.___-__" });
            $('#telefone').mask('0000000-0000', { placeholder: "_______-____" });

            // Validação de email
            $('#email').on('blur', function () {
                const email = $(this).val();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email && !emailRegex.test(email)) {
                    $(this).css('border-color', 'red');
                    alert('Por favor, insira um email válido no formato email@email.com');
                } else {
                    $(this).css('border-color', '#ccc');
                }
            });

            // Inicializar Choices.js em todos os selects
            const modeloSelect = new Choices('#modelo', {
                searchEnabled: true,
                searchPlaceholderValue: 'Pesquisar...',
                placeholder: true,
                placeholderValue: 'Selecione um modelo',
                noResultsText: 'Nenhum resultado encontrado',
                itemSelectText: 'Clique para selecionar'
            });

            const veiculoSelect = new Choices('#veiculo', {
                searchEnabled: true,
                searchPlaceholderValue: 'Pesquisar...',
                placeholder: true,
                placeholderValue: 'Selecione um veículo',
                noResultsText: 'Nenhum resultado encontrado',
                itemSelectText: 'Clique para selecionar'
            });

            const localSelect = new Choices('#local', {
                searchEnabled: true,
                searchPlaceholderValue: 'Pesquisar...',
                placeholder: true,
                placeholderValue: 'Selecione um local',
                noResultsText: 'Nenhum resultado encontrado',
                itemSelectText: 'Clique para selecionar'
            });

            const tipoTreinoSelect = new Choices('#tipo_treino', {
                searchEnabled: true,
                searchPlaceholderValue: 'Pesquisar...',
                placeholder: true,
                placeholderValue: 'Selecione um tipo de treino',
                noResultsText: 'Nenhum resultado encontrado',
                itemSelectText: 'Clique para selecionar'
            });

            // Inicialização dos selects com Choices.js

            // Inicialização do Choices.js

            // Variável para armazenar a instância do Choices.js para local_treino
            let localTreinoSelect;

            // Inicializar o Choices.js para local_treino
            function initLocalTreinoChoices() {
                if (localTreinoSelect) {
                    localTreinoSelect.destroy();
                }
                localTreinoSelect = new Choices('#local_treino', {
                    searchEnabled: true,
                    searchPlaceholderValue: 'Pesquisar...',
                    placeholder: true,
                    placeholderValue: 'Selecione um local de treino',
                    noResultsText: 'Nenhum resultado encontrado',
                    itemSelectText: 'Clique para selecionar'
                });
            }

            // Inicializar o Choices.js para local_treino na carga da página
            initLocalTreinoChoices();

            // Carregar locais de treino quando o local for selecionado
            document.querySelector('#local').addEventListener('change', function () {
                var localId = this.value;
                if (localId) {
                    $.ajax({
                        url: '/api/locais-treino-por-local/' + localId,
                        type: 'GET',
                        success: function (data) {
                            // Destruir a instância atual do Choices.js
                            if (localTreinoSelect) {
                                localTreinoSelect.destroy();
                            }

                            // Atualizar as opções do select
                            var selectElement = document.getElementById('local_treino');
                            selectElement.innerHTML = '<option value="">Selecione um local de treino</option>';

                            // Adicionar as novas opções
                            for (var i = 0; i < data.length; i++) {
                                var option = document.createElement('option');
                                option.value = data[i].id;
                                option.textContent = data[i].nome;
                                selectElement.appendChild(option);
                            }

                            // Reinicializar o Choices.js
                            initLocalTreinoChoices();
                        }
                    });
                } else {
                    // Destruir a instância atual do Choices.js
                    if (localTreinoSelect) {
                        localTreinoSelect.destroy();
                    }

                    // Limpar as opções
                    document.getElementById('local_treino').innerHTML = '<option value="">Selecione um local de treino</option>';

                    // Reinicializar o Choices.js
                    initLocalTreinoChoices();
                }
            });

            // Enviar formulário via AJAX
            $('#add-user-form').submit(function (e) {
                e.preventDefault();
                var formData = {
                    nome: $('#nome').val(),
                    email: $('#email').val(),
                    data_nascimento: $('#data_nascimento').val(),
                    documento: $('#documento').val(),
                    telefone: $('#telefone').val(),
                    data_inicio: formatDate($('#data_inicio').val()),
                    modelo: $('#modelo option:selected').text(),
                    tamanho: $('#tamanho').val(),
                    veiculo_id: parseInt($('#veiculo').val()),
                    local_id: parseInt($('#local').val()),
                    local_treino_id: parseInt($('#local_treino').val()),
                    tipo_treino_id: parseInt($('#tipo_treino').val())
                };

                const resultContainer = $('#result');
                resultContainer.show();
                resultContainer.html('Processando...');

                $.ajax({
                    url: '/add-user-not-registered',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify([formData]), // Enviando como array conforme esperado pelo endpoint
                    success: function (result) {
                        resultContainer.attr('class', 'result-container success');
                        resultContainer.html(`Usuário adicionado com sucesso! ID: ${result.created_users[0].id}`);

                        // Limpar apenas os campos da seção Usuário
                        $('#nome, #email, #data_nascimento, #documento, #telefone, #tamanho').val('');

                        // Resetar apenas o select de modelo
                        modeloSelect.setChoiceByValue('');
                    },
                    error: function (xhr) {
                        const error = xhr.responseJSON;
                        resultContainer.attr('class', 'result-container error');
                        resultContainer.html(`Erro: ${error && error.errors ? error.errors[0].error : 'Falha ao adicionar usuário'}`);
                    }
                });
            });

            // Função para formatar data de YYYY-MM-DD para DD/MM/YYYY
            function formatDate(dateString) {
                if (!dateString) return '';
                const parts = dateString.split('-');
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        });
    </script>
</body>

</html>
